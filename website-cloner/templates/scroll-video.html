<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll Video</title>
<!--
  Scroll-scrubbed "3D" video, no framework.
  1. npm run scroll-video -- build clip1.mp4 clip2.mp4 --name minha-casa
  2. copy public/scroll/minha-casa/ next to this file (or point MANIFEST at it)
  3. edit MANIFEST, LENGTH and SECTIONS below
-->
<style>
  :root { color-scheme: dark; --bg: #05070a; --fg: #ffffff; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Helvetica Neue", Arial, sans-serif; }
  [hidden] { display: none !important; }
  .sv-track { position: relative; }
  .sv-sticky { position: sticky; top: 0; height: 100vh; height: 100dvh; overflow: hidden; background: var(--bg); }
  .sv-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .sv-shade { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(0,0,0,.45), rgba(0,0,0,0) 45%), linear-gradient(0deg, rgba(0,0,0,.35), rgba(0,0,0,0) 40%); }
  .sv-caption { position: absolute; bottom: 9dvh; max-width: min(520px, calc(100vw - 32px)); opacity: 0; will-change: opacity, transform; text-shadow: 0 1px 18px rgba(0,0,0,.3); }
  .sv-left { left: max(16px, 5vw); }
  .sv-right { right: max(16px, 5vw); text-align: right; }
  .sv-center { left: 50%; translate: -50% 0; text-align: center; }
  .sv-eyebrow { margin: 0 0 10px; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; opacity: .8; }
  .sv-title { margin: 0; font-size: clamp(34px, 4.4vw, 72px); line-height: 1; font-weight: 300; letter-spacing: -.015em; text-wrap: balance; }
  .sv-text { margin: 14px 0 0; font-size: clamp(15px, 1.15vw, 19px); line-height: 1.6; opacity: .92; }
  .sv-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(255,255,255,.7); transform-origin: left; transform: scaleX(0); }
  .sv-hint { position: absolute; left: 50%; bottom: 22px; translate: -50% 0; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; opacity: .75; transition: opacity .4s; }
  .after { min-height: 60vh; display: grid; place-items: center; padding: 24px; opacity: .75; }
</style>
</head>
<body>

<section class="sv-track" id="sv-track">
  <div class="sv-sticky">
    <canvas class="sv-canvas" id="sv-canvas" aria-hidden="true"></canvas>
    <div class="sv-shade"></div>
    <div id="sv-captions"></div>
    <div class="sv-hint" id="sv-hint">Role para explorar ↓</div>
    <div class="sv-progress" id="sv-progress"></div>
  </div>
</section>
<section class="after"><p>Fim da sequência — a página continua normalmente daqui.</p></section>

<script>
// ---------------- configure here ----------------
const MANIFEST = "scroll/torre-demo/manifest.json";
const LENGTH = 6; // scroll distance in screen heights (~1 per second of footage)
const SECTIONS = [
  { from: 0, to: 0.22, eyebrow: "Abu Dhabi · The Corniche", title: "A tower on the water" },
  { from: 0.3, to: 0.55, title: "Rise to level 14", text: "Thirty-two floors over the old harbour. Scroll to fly up the glass." },
  { from: 0.66, to: 0.82, align: "right", title: "Through the glass", text: "The living room opens onto the terrace." },
  { from: 0.88, to: 1, title: "The primary bathroom", text: "A stone bath against lit travertine, beside a window to the sea." },
];
// ------------------------------------------------

(() => {
  const track = document.getElementById("sv-track");
  const canvas = document.getElementById("sv-canvas");
  const ctx = canvas.getContext("2d");
  const bar = document.getElementById("sv-progress");
  const hint = document.getElementById("sv-hint");
  track.style.height = (LENGTH + 1) * 100 + "vh";
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ease = reduced ? 1 : 0.16;
  const base = MANIFEST.slice(0, MANIFEST.lastIndexOf("/") + 1);

  const caps = SECTIONS.map((s) => {
    const el = document.createElement("div");
    el.className = "sv-caption sv-" + (s.align || "left");
    el.innerHTML = (s.eyebrow ? `<p class="sv-eyebrow"></p>` : "") + `<h2 class="sv-title"></h2>` + (s.text ? `<p class="sv-text"></p>` : "");
    if (s.eyebrow) el.querySelector(".sv-eyebrow").textContent = s.eyebrow;
    el.querySelector(".sv-title").textContent = s.title;
    if (s.text) el.querySelector(".sv-text").textContent = s.text;
    document.getElementById("sv-captions").appendChild(el);
    return el;
  });
  const opacity = (p, a, b, e = 0.04) => (p < a - e || p > b + e ? 0 : p < a + e ? Math.min(1, (p - (a - e)) / (2 * e)) : p > b - e ? Math.min(1, (b + e - p) / (2 * e)) : 1);

  let set = null, images = [], loaded = [], current = 0, drawn = -1;
  const url = (i) => base + set.path.replace("{n}", String(i + 1).padStart(set.pad, "0"));
  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1), r = canvas.getBoundingClientRect();
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr); drawn = -1;
  }
  function nearest(i) { for (let d = 0; d < loaded.length; d++) { if (loaded[i - d]) return i - d; if (loaded[i + d]) return i + d; } return -1; }
  function draw(i) {
    const k = nearest(i); if (k < 0 || k === drawn) return;
    const img = images[k], s = Math.max(canvas.width / img.naturalWidth, canvas.height / img.naturalHeight);
    const w = img.naturalWidth * s, h = img.naturalHeight * s;
    ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h); drawn = k;
  }
  function progress() { const r = track.getBoundingClientRect(), t = r.height - innerHeight; return t > 0 ? Math.min(1, Math.max(0, -r.top / t)) : 0; }
  function tick() {
    if (set) {
      const target = progress() * (set.count - 1);
      current += (target - current) * ease;
      if (Math.abs(target - current) < 0.01) current = target;
      draw(Math.round(current));
      const p = set.count > 1 ? current / (set.count - 1) : 0;
      bar.style.transform = `scaleX(${p})`;
      hint.style.opacity = p > 0.02 ? 0 : 0.75;
      caps.forEach((el, i) => { const o = opacity(p, SECTIONS[i].from, SECTIONS[i].to); el.style.opacity = o; el.style.transform = `translateY(${(1 - o) * 18}px)`; });
    }
    requestAnimationFrame(tick);
  }
  function load() {
    const n = set.count, order = [], seen = new Set();
    for (const st of [n, 16, 8, 4, 2, 1]) for (let i = 0; i < n; i += st) if (!seen.has(i)) { seen.add(i); order.push(i); }
    let next = 0;
    const pump = () => {
      if (next >= order.length) return;
      const i = order[next++], img = new Image();
      img.decoding = "async";
      img.onload = img.onerror = () => { loaded[i] = img.naturalWidth > 0; if (loaded[i]) images[i] = img; if (i === 0) draw(0); pump(); };
      img.src = url(i);
    };
    for (let c = 0; c < 6; c++) pump();
  }
  addEventListener("resize", resize);
  fetch(MANIFEST).then((r) => r.json()).then((m) => {
    const portrait = innerWidth / innerHeight < 0.8;
    set = portrait && m.sets.mobile ? m.sets.mobile : m.sets.desktop;
    images = new Array(set.count).fill(null); loaded = new Array(set.count).fill(false);
    resize(); load();
  });
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
