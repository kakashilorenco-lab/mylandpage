<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Gerar panoramas de demonstração</title>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js" } }</script></head>
<body style="margin:0;background:#111;color:#ddd;font:14px system-ui">
<p id="st">Gerando…</p>
<script type="module">
import * as THREE from 'three';
import { buildScene, renderPano, POINTS, FLOOR_Y } from './demo-scene.js';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(64, 64);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = buildScene(renderer);
window.__panos = {};
window.gerar = (ids, width) => {
  for (const p of POINTS) {
    if (ids && !ids.includes(p.id)) continue;
    window.__panos[p.id] = renderPano(renderer, scene, new THREE.Vector3(p.x, FLOOR_Y + 1.5, p.z), width || 3072);
  }
  document.getElementById('st').textContent = 'Pronto: ' + Object.keys(window.__panos).join(', ');
  return Object.keys(window.__panos);
};
window.__ready = true;
</script></body></html>
